<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>토픽 듣기 카드</title>
<meta name="theme-color" content="#1f2a44">
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{
  --bg:#f4f5f8; --surface:#fff; --surface2:#eef0f5; --text:#1b1f2a; --muted:#646b7c; --line:#dde1ea;
  --accent:#2f5bd3; --accent-ink:#fff; --hl:#fff3c4; --hl-ink:#1b1f2a; --badge:#e6ecfb; --badge-ink:#2a4aa8; --ok:#1f9d63;
  --shadow:0 1px 2px rgba(20,30,60,.06),0 4px 16px rgba(20,30,60,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11141b; --surface:#1a1e28; --surface2:#232837; --text:#e7e9ef; --muted:#9aa1b2; --line:#2c3243;
    --accent:#6f95ff; --accent-ink:#0d1220; --hl:#4a3f12; --hl-ink:#fff6d6; --badge:#243256; --badge-ink:#b9caff; --ok:#3fcf8e;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#11141b; --surface:#1a1e28; --surface2:#232837; --text:#e7e9ef; --muted:#9aa1b2; --line:#2c3243;
  --accent:#6f95ff; --accent-ink:#0d1220; --hl:#4a3f12; --hl-ink:#fff6d6; --badge:#243256; --badge-ink:#b9caff; --ok:#3fcf8e;
  --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:16px/1.6 "Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;-webkit-text-size-adjust:100%}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
.hidden{display:none!important}

/* top bar */
header{position:sticky;top:0;z-index:10;background:var(--surface);border-bottom:1px solid var(--line)}
.bar{max-width:820px;margin:0 auto;display:flex;align-items:center;gap:8px;padding:10px 16px}
.bar h1{font-size:16px;margin:0;white-space:nowrap}
.bar select{min-width:0;flex:1;max-width:260px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface2)}
.spacer{flex:1}
.icon-btn{border:0;background:transparent;padding:6px 8px;border-radius:8px;font-size:15px;color:var(--muted);white-space:nowrap}
.icon-btn:hover{background:var(--surface2);color:var(--text)}
.progress{max-width:820px;margin:0 auto;padding:0 16px 8px;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.track{flex:1;height:4px;background:var(--surface2);border-radius:2px;overflow:hidden}
.fill{height:100%;background:var(--ok);width:0}
#counter{border:0;background:transparent;color:var(--muted);font-size:13px;padding:2px 4px;border-radius:6px}
#counter:hover{background:var(--surface2)}

main{max-width:820px;margin:0 auto;padding:16px 16px 140px}

/* empty state */
.drop{margin-top:8vh;border:2px dashed var(--line);border-radius:16px;padding:40px 20px;text-align:center;background:var(--surface)}
.drop.drag{border-color:var(--accent)}
.drop h2{margin:0 0 6px;font-size:20px}
.drop p{margin:0 0 18px;color:var(--muted);font-size:14px}
.primary{border:0;background:var(--accent);color:var(--accent-ink);padding:10px 18px;border-radius:10px;font-weight:600}
.ghost{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:10px}
#loadMsg{margin-top:14px;color:var(--muted);font-size:14px}

/* resume banner */
.resume{display:flex;align-items:center;gap:10px;background:var(--badge);color:var(--badge-ink);border-radius:12px;padding:10px 14px;margin-bottom:12px;font-size:14px}
.resume span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.resume button{border:0;background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:6px 12px;font-weight:600;white-space:nowrap}
.resume .x{background:transparent;color:inherit;padding:4px 6px;font-weight:400}

/* card */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:20px 20px 24px}
.card-top{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.badge{background:var(--badge);color:var(--badge-ink);font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px}
.readmark{font-size:12px;color:var(--ok);font-weight:600}
.title{font-size:22px;line-height:1.4;margin:4px 0 14px;font-weight:700;word-break:keep-all;white-space:pre-wrap;border-radius:6px}
.field{margin-top:14px}
.field-h{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.02em;margin-bottom:4px;padding:1px 4px;border-radius:4px;display:inline-block}
.field-b{white-space:pre-wrap;word-break:break-word}
.ln{display:block;border-radius:4px;padding:0 4px;margin:0 -4px;cursor:pointer;min-height:1.6em}
.ln:hover{background:var(--surface2)}
.ln.on,.field-h.on,.title.on{background:var(--hl);color:var(--hl-ink)}
.field.off{opacity:.45}
.imgs{margin-top:18px;display:grid;gap:10px}
.imgs img{max-width:100%;height:auto;display:block;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:zoom-in}

/* bottom player */
.player{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.player-in{max-width:820px;margin:0 auto;display:flex;align-items:center;justify-content:center;gap:14px}
.nav{width:48px;height:48px;border-radius:50%;border:1px solid var(--line);background:var(--surface2);font-size:20px}
.play{width:64px;height:64px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);font-size:26px;display:grid;place-items:center}
.rate{border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:6px 10px;font-size:14px;min-width:58px}
.auto{display:flex;align-items:center;gap:4px;font-size:13px;color:var(--muted)}

/* dialogs */
dialog{border:0;border-radius:16px;padding:0;background:var(--surface);color:var(--text);width:min(520px,calc(100vw - 32px));max-height:85vh}
dialog::backdrop{background:rgba(0,0,0,.45)}
.dlg{padding:18px 20px 20px;overflow:auto;max-height:85vh}
.dlg h3{margin:0 0 14px;font-size:17px}
.row{margin:12px 0}
.row label.lb{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.row select,.row input[type=text],.row input[type=number]{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface2)}
.checks{display:flex;flex-wrap:wrap;gap:6px 14px}
.checks label{display:flex;align-items:center;gap:6px;font-size:14px}
.dlg-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.results{list-style:none;margin:8px 0 0;padding:0;max-height:50vh;overflow:auto}
.results li button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:8px 6px;border-bottom:1px solid var(--line)}
.results li button:hover{background:var(--surface2)}
.results small{color:var(--muted)}

#lightbox{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;padding:12px;overflow:auto}
#lightbox img{max-width:100%;max-height:100%;background:#fff;border-radius:6px}

@media (max-width:520px){
  .bar h1{display:none}
  .title{font-size:20px}
  .card{padding:16px 14px 20px;border-radius:14px}
  .player-in{gap:10px}
}
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1>토픽 듣기</h1>
    <select id="sheetSel" class="hidden" aria-label="시트"></select>
    <div class="spacer"></div>
    <button class="icon-btn hidden" id="searchBtn" title="토픽 검색">검색</button>
    <button class="icon-btn" id="settingsBtn" title="설정">설정</button>
    <button class="icon-btn" id="fileBtn" title="엑셀 파일 올리기">파일</button>
  </div>
  <div class="progress hidden" id="progressRow">
    <div class="track"><div class="fill" id="readFill"></div></div>
    <span id="readTxt"></span>
    <button id="counter" title="번호로 이동"></button>
  </div>
</header>

<main>
  <section id="empty">
    <div class="drop" id="drop">
      <h2>엑셀 파일을 올려 주세요</h2>
      <p>첫 행을 머리글로 보고, 각 행을 카드 한 장으로 만듭니다.<br>같은 행에 있는 그림도 카드에 붙고, 파일은 이 기기 안에서만 처리됩니다.</p>
      <button class="primary" id="pickBtn">xlsx 파일 선택</button>
      <div id="loadMsg"></div>
    </div>
  </section>
  <section id="view" class="hidden">
    <div class="resume hidden" id="resume">
      <span id="resumeTxt"></span>
      <button id="resumeBtn">이어 듣기</button>
      <button class="x" id="resumeX" aria-label="닫기">✕</button>
    </div>
    <article class="card" id="card"></article>
  </section>
</main>

<div class="player hidden" id="player">
  <div class="player-in">
    <button class="rate" id="rateBtn" title="읽기 속도">1.0x</button>
    <button class="nav" id="prevBtn" title="이전 카드 (←)">‹</button>
    <button class="play" id="playBtn" title="재생 / 일시정지 (Space)">▶</button>
    <button class="nav" id="nextBtn" title="다음 카드 (→)">›</button>
    <label class="auto" title="카드를 다 읽으면 다음 카드로"><input type="checkbox" id="autoChk"> 연속</label>
  </div>
</div>

<input type="file" id="fileIn" accept=".xlsx,.xlsm,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" hidden>

<dialog id="settingsDlg"><div class="dlg">
  <h3>설정</h3>
  <div class="row"><label class="lb" for="voiceSel">목소리</label><select id="voiceSel"></select></div>
  <div class="row"><label class="lb" for="rateIn">속도 <b id="rateVal"></b></label><input type="range" id="rateIn" min="0.6" max="2" step="0.1" style="width:100%"></div>
  <div class="row"><label class="lb" for="titleSel">제목으로 쓸 칸 (현재 시트)</label><select id="titleSel"></select></div>
  <div class="row"><label class="lb">읽을 칸 (현재 시트)</label><div class="checks" id="fieldChecks"></div></div>
  <div class="row checks">
    <label><input type="checkbox" id="sayHeadChk"> 칸 이름도 읽기 (예: "정의.")</label>
  </div>
  <div class="row"><label class="lb" for="themeSel">화면</label>
    <select id="themeSel"><option value="">기기 설정 따름</option><option value="light">밝게</option><option value="dark">어둡게</option></select></div>
  <div class="dlg-actions">
    <button class="ghost" id="resetReadBtn">이 시트 읽음 기록 지우기</button>
    <button class="primary" id="closeSettings">닫기</button>
  </div>
</div></dialog>

<dialog id="searchDlg"><div class="dlg">
  <h3>토픽 검색</h3>
  <input type="text" id="searchIn" placeholder="토픽 이름이나 내용으로 검색" style="width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface2)">
  <ul class="results" id="results"></ul>
  <div class="dlg-actions"><button class="ghost" id="closeSearch">닫기</button></div>
</div></dialog>

<dialog id="jumpDlg"><div class="dlg">
  <h3>번호로 이동</h3>
  <div class="row"><input type="number" id="jumpIn" min="1"></div>
  <div class="dlg-actions"><button class="ghost" id="closeJump">취소</button><button class="primary" id="doJump">이동</button></div>
</div></dialog>

<div id="lightbox" class="hidden"><img alt=""></div>

<script>
'use strict';
/* ---------- small helpers ---------- */
const $ = id => document.getElementById(id);
const LS = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- IndexedDB (deck + images) ---------- */
const DB = {
  db: null,
  open(){
    if (this.db) return Promise.resolve(this.db);
    return new Promise((res, rej) => {
      const r = indexedDB.open('topic-tts-cards', 1);
      r.onupgradeneeded = () => { r.result.createObjectStore('meta'); r.result.createObjectStore('images'); };
      r.onsuccess = () => { this.db = r.result; res(this.db); };
      r.onerror = () => rej(r.error);
    });
  },
  async tx(store, mode, fn){
    const db = await this.open();
    return new Promise((res, rej) => {
      const t = db.transaction(store, mode); const s = t.objectStore(store);
      let out; const r = fn(s); if (r) r.onsuccess = () => { out = r.result; };
      t.oncomplete = () => res(out); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
    });
  },
  get(store, key){ return this.tx(store, 'readonly', s => s.get(key)); },
  async replaceAll(deck, images){
    const db = await this.open();
    return new Promise((res, rej) => {
      const t = db.transaction(['meta','images'], 'readwrite');
      t.objectStore('meta').clear(); t.objectStore('images').clear();
      for (const [id, blob] of images) t.objectStore('images').put(blob, id);
      t.objectStore('meta').put(deck, 'deck');
      t.oncomplete = res; t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
    });
  }
};

/* ---------- xlsx parsing (text via SheetJS, pictures via JSZip) ---------- */
const IMG_MIME = {png:'image/png',jpg:'image/jpeg',jpeg:'image/jpeg',gif:'image/gif',webp:'image/webp',bmp:'image/bmp',svg:'image/svg+xml'};
const xmlDoc = s => new DOMParser().parseFromString(s, 'application/xml');
const byLocal = (node, name) => Array.from(node.getElementsByTagNameNS('*', name));
const firstLocal = (node, name) => node.getElementsByTagNameNS('*', name)[0] || null;
function resolvePath(baseFile, target){
  if (target.startsWith('/')) return target.slice(1);
  const parts = baseFile.split('/'); parts.pop();
  for (const p of target.split('/')){ if (p === '..') parts.pop(); else if (p !== '.') parts.push(p); }
  return parts.join('/');
}
function relsPath(file){ const i = file.lastIndexOf('/'); return file.slice(0, i) + '/_rels/' + file.slice(i + 1) + '.rels'; }
async function readRels(zip, file){
  const f = zip.file(relsPath(file)); const map = {};
  if (!f) return map;
  for (const r of byLocal(xmlDoc(await f.async('string')), 'Relationship')){
    if (r.getAttribute('TargetMode') === 'External') continue;
    map[r.getAttribute('Id')] = { type: r.getAttribute('Type') || '', target: resolvePath(file, r.getAttribute('Target')) };
  }
  return map;
}
function rIdOf(el){
  for (const a of el.attributes) if (a.localName === 'embed' || (a.localName === 'id' && a.prefix === 'r')) return a.value;
  return null;
}

// returns [{row, col, path}] (0-based row/col) for pictures anchored in a sheet
async function sheetPictures(zip, sheetPath){
  const pics = [];
  const rels = await readRels(zip, sheetPath);
  // 1) floating pictures in drawings
  for (const rel of Object.values(rels)){
    if (!/\/drawing$/.test(rel.type)) continue;
    const df = zip.file(rel.target); if (!df) continue;
    const drels = await readRels(zip, rel.target);
    const doc = xmlDoc(await df.async('string'));
    const anchors = [...byLocal(doc, 'twoCellAnchor'), ...byLocal(doc, 'oneCellAnchor')];
    for (const a of anchors){
      const from = firstLocal(a, 'from'); if (!from) continue;
      const row = +firstLocal(from, 'row').textContent, col = +firstLocal(from, 'col').textContent;
      for (const blip of byLocal(a, 'blip')){
        const id = rIdOf(blip); const t = id && drels[id];
        if (t) pics.push({ row, col, path: t.target });
      }
    }
  }
  // 2) pictures placed in cells (Excel "Place in Cell" / IMAGE())
  try {
    const sx = await zip.file(sheetPath).async('string');
    const cellRe = /<c\b[^>]*?\br="([A-Z]+)(\d+)"[^>]*?\bvm="(\d+)"/g;
    const hits = []; let m;
    while ((m = cellRe.exec(sx))) hits.push(m);
    if (hits.length){
      const imgTargets = await richImageTargets(zip);
      for (const h of hits){
        const p = imgTargets[+h[3] - 1];
        if (p) pics.push({ row: +h[2] - 1, col: XLSX.utils.decode_col(h[1]), path: p });
      }
    }
  } catch(e){ console.warn('in-cell images skipped', e); }
  return pics;
}
let _richCache = null;
async function richImageTargets(zip){
  if (_richCache) return _richCache;
  const out = [];
  const meta = zip.file('xl/metadata.xml'), rv = zip.file('xl/richData/rdrichvalue.xml'), rel = zip.file('xl/richData/richValueRel.xml');
  if (!meta || !rv || !rel) return (_richCache = out);
  const md = xmlDoc(await meta.async('string'));
  const futureRvb = byLocal(md, 'rvb').map(e => +e.getAttribute('i'));
  const vmBlocks = byLocal(firstLocal(md, 'valueMetadata') || md, 'bk').map(bk => +firstLocal(bk, 'rc').getAttribute('v'));
  const rvs = byLocal(xmlDoc(await rv.async('string')), 'rv').map(e => +(firstLocal(e, 'v') || {}).textContent);
  const relDoc = xmlDoc(await rel.async('string'));
  const relIds = byLocal(relDoc, 'rel').map(rIdOf);
  const relMap = await readRels(zip, 'xl/richData/richValueRel.xml');
  vmBlocks.forEach((v, i) => {
    const rvIdx = futureRvb[v]; const relIdx = rvs[rvIdx]; const rid = relIds[relIdx];
    out[i] = rid && relMap[rid] ? relMap[rid].target : null;
  });
  return (_richCache = out);
}

async function parseWorkbook(file, onMsg){
  onMsg('파일 읽는 중…');
  const buf = await file.arrayBuffer();
  onMsg('표 내용 분석 중…');
  await new Promise(r => setTimeout(r, 20));
  const wb = XLSX.read(buf, { type: 'array', cellStyles: true });
  onMsg('그림 찾는 중…');
  const zip = await JSZip.loadAsync(buf);
  _richCache = null;
  // sheet name -> worksheet xml path
  const wbPath = 'xl/workbook.xml';
  const wbRels = await readRels(zip, wbPath);
  const wbx = xmlDoc(await zip.file(wbPath).async('string'));
  const sheetPathByName = {};
  for (const s of byLocal(wbx, 'sheet')){ const r = wbRels[rIdOf(s)]; if (r) sheetPathByName[s.getAttribute('name')] = r.target; }

  const images = new Map(); const sheets = [];
  for (const name of wb.SheetNames){
    const ws = wb.Sheets[name]; if (!ws || !ws['!ref']) continue;
    const range = XLSX.utils.decode_range(ws['!ref']);
    const hiddenCols = new Set();
    (ws['!cols'] || []).forEach((c, i) => { if (c && (c.hidden || c.wch === 0 || c.wpx === 0)) hiddenCols.add(i); });
    const rows = [];
    for (let r = range.s.r; r <= range.e.r; r++){
      const vals = [];
      for (let c = range.s.c; c <= range.e.c; c++){
        const cell = ws[XLSX.utils.encode_cell({ r, c })];
        let v = cell ? (cell.w != null ? cell.w : cell.v) : '';
        v = v == null ? '' : String(v).replace(/\r\n?/g, '\n').replace(/\s+$/,'').replace(/^\n+/,'');
        vals.push(v);
      }
      rows.push({ r, vals });
    }
    const hi = rows.findIndex(x => x.vals.filter(Boolean).length >= 2);
    if (hi < 0) continue;
    const headRow = rows[hi];
    const cols = [];
    headRow.vals.forEach((h, i) => {
      const used = h || rows.slice(hi + 1).some(x => x.vals[i]);
      if (used) cols.push({ idx: i, name: h || ('열 ' + XLSX.utils.encode_col(range.s.c + i)), hidden: hiddenCols.has(range.s.c + i) });
    });
    const titleCol = guessTitle(cols);
    const badgeCol = guessBadge(cols, titleCol);
    const cards = [];
    for (const x of rows.slice(hi + 1)){
      const f = cols.map(c => x.vals[c.idx] || '');
      const filled = f.filter(Boolean).length;
      if (!filled) continue;
      if (!f[titleCol] && filled < 2) continue; // section title rows
      cards.push({ row: x.r, f, img: [] });
    }
    if (!cards.length) continue;
    // attach pictures to the card on the same row (or the card the row belongs to)
    const sp = sheetPathByName[name];
    if (sp){
      const pics = await sheetPictures(zip, sp);
      pics.sort((a, b) => a.row - b.row || a.col - b.col);
      for (const p of pics){
        const ext = p.path.split('.').pop().toLowerCase();
        if (!IMG_MIME[ext] || p.row <= headRow.r) continue;
        let lo = 0, hi2 = cards.length - 1, at = -1;
        while (lo <= hi2){ const mid = (lo + hi2) >> 1; if (cards[mid].row <= p.row){ at = mid; lo = mid + 1; } else hi2 = mid - 1; }
        if (at < 0) continue;
        if (!images.has(p.path)){
          const zf = zip.file(p.path); if (!zf) continue;
          images.set(p.path, new Blob([await zf.async('uint8array')], { type: IMG_MIME[ext] }));
        }
        if (!cards[at].img.includes(p.path)) cards[at].img.push(p.path);
      }
    }
    sheets.push({ name, cols: cols.map(c => ({ name: c.name, hidden: c.hidden })), titleCol, badgeCol, cards });
    onMsg(`시트 정리 중… (${name})`);
  }
  if (!sheets.length) throw new Error('카드로 만들 행을 찾지 못했어요.');
  return {
    deck: { key: [file.name, file.size, file.lastModified].join('|'), fileName: file.name, sheets, savedAt: Date.now() },
    images
  };
}
function guessTitle(cols){
  const n = cols.map(c => c.name.replace(/\s/g, ''));
  const pick = [i => /^중토픽/.test(n[i]), i => n[i] === '토픽', i => /토픽|주제|제목|용어|title|topic/i.test(n[i]) && !/상위|대분류/.test(n[i])];
  for (const p of pick){ const i = n.findIndex((_, k) => p(k)); if (i >= 0) return i; }
  const i = n.findIndex(x => !/^(번호|no\.?|#|순번)$/i.test(x));
  return i < 0 ? 0 : i;
}
function guessBadge(cols, t){
  const i = cols.findIndex((c, k) => k !== t && /상위|대분류|분류|분야|도메인|과목|토픽\(대분류\)|^토픽$/.test(c.name.replace(/\s/g, '')));
  return i;
}

/* ---------- state ---------- */
const S = {
  deck: null, sheetIdx: 0, card: 0, seg: 0,
  playing: false, token: 0, segs: [], urls: [],
  settings: Object.assign({ rate: 1, voice: '', auto: true, sayHead: true, theme: '', off: {}, title: {} }, LS.get('ttsc.settings', {}))
};
const sheet = () => S.deck.sheets[S.sheetIdx];
const saveSettings = () => LS.set('ttsc.settings', S.settings);
const posKey = () => 'ttsc.pos.' + S.deck.key;
const readKey = () => 'ttsc.read.' + S.deck.key + '.' + sheet().name;
const offKey = () => S.deck.key + '|' + sheet().name;
function titleCol(){ const v = S.settings.title[offKey()]; return v == null ? sheet().titleCol : v; }
function isOff(i){
  const o = S.settings.off[offKey()];
  if (o && i in o) return o[i];
  const c = sheet().cols[i];
  return c.hidden || i === sheet().badgeCol || /^(번호|no\.?|#|순번)$/i.test(c.name.trim());
}
function savePos(){
  const p = LS.get(posKey(), { bySheet: {} });
  p.sheet = sheet().name; p.bySheet[sheet().name] = { card: S.card, seg: S.seg }; p.at = Date.now();
  LS.set(posKey(), p);
}
function readSet(){ return new Set(LS.get(readKey(), [])); }
function markRead(i){ const s = readSet(); if (!s.has(i)){ s.add(i); LS.set(readKey(), [...s]); } updateProgress(); }

/* ---------- rendering ---------- */
function cardTitle(c){ return c.f[titleCol()] || '(제목 없음)'; }
function renderCard(){
  const sh = sheet(), c = sh.cards[S.card], tc = titleCol();
  S.urls.forEach(u => URL.revokeObjectURL(u)); S.urls = [];
  const segs = []; let html = '';
  const addSeg = (text, el) => { segs.push({ text, el }); return segs.length - 1; };
  const badge = sh.badgeCol >= 0 && sh.badgeCol !== tc ? c.f[sh.badgeCol] : '';
  const isRead = readSet().has(S.card);
  html += `<div class="card-top">${badge ? `<span class="badge">${esc(badge.split('\n')[0])}</span>` : ''}${isRead ? '<span class="readmark">✓ 읽음</span>' : ''}</div>`;
  const t = cardTitle(c);
  addSeg(t, 'title');
  html += `<h2 class="title" id="s-title" data-seg="0">${esc(t)}</h2>`;
  sh.cols.forEach((col, i) => {
    if (i === tc || (i === sh.badgeCol && isOff(i))) return;
    const v = c.f[i]; if (!v) return;
    const off = isOff(i);
    let body = '';
    const hid = 'h' + i;
    if (!off && S.settings.sayHead) addSeg(col.name, hid);
    v.split('\n').forEach((line, li) => {
      const id = 'l' + i + '_' + li;
      if (!off && line.trim()) chunk(line).forEach(part => addSeg(part, id));
      const first = segs.findIndex(s => s.el === id);
      body += `<span class="ln" id="s-${id}"${first >= 0 ? ` data-seg="${first}"` : ''}>${esc(line) || ' '}</span>`;
    });
    const hseg = segs.findIndex(s => s.el === hid);
    html += `<section class="field${off ? ' off' : ''}"><div class="field-h" id="s-${hid}"${hseg >= 0 ? ` data-seg="${hseg}"` : ''}>${esc(col.name)}</div><div class="field-b">${body}</div></section>`;
  });
  if (c.img.length) html += `<div class="imgs" id="imgs"></div>`;
  const el = $('card'); el.innerHTML = html;
  if (c.img.length) loadImages(c.img);
  S.segs = segs;
  $('counter').textContent = `${S.card + 1} / ${sh.cards.length}`;
  highlight();
}
async function loadImages(ids){
  const box = $('imgs'); const myCard = S.card;
  for (const id of ids){
    const blob = await DB.get('images', id);
    if (!blob || myCard !== S.card || !box.isConnected) continue;
    const u = URL.createObjectURL(blob); S.urls.push(u);
    const im = new Image(); im.src = u; im.alt = '카드 그림'; im.loading = 'lazy';
    im.onclick = () => { $('lightbox').querySelector('img').src = u; $('lightbox').classList.remove('hidden'); };
    box.appendChild(im);
  }
}
function highlight(){
  document.querySelectorAll('#card .on').forEach(e => e.classList.remove('on'));
  if (!S.playing && S.seg === 0) return;
  const s = S.segs[S.seg]; if (!s) return;
  const e = $('s-' + s.el); if (!e) return;
  e.classList.add('on');
  if (S.playing){
    const r = e.getBoundingClientRect();
    if (r.top < 110 || r.bottom > innerHeight - 110) e.scrollIntoView({ block: 'center', behavior: 'smooth' });
  }
}
function updateProgress(){
  const n = sheet().cards.length, k = readSet().size;
  $('readFill').style.width = (k / n * 100).toFixed(2) + '%';
  $('readTxt').textContent = `읽음 ${k}`;
}
function renderSheetSel(){
  const sel = $('sheetSel');
  sel.innerHTML = S.deck.sheets.map((s, i) => `<option value="${i}">${esc(s.name)} (${s.cards.length})</option>`).join('');
  sel.value = S.sheetIdx; sel.classList.toggle('hidden', S.deck.sheets.length < 2);
}
function showDeck(){
  $('empty').classList.add('hidden'); $('view').classList.remove('hidden');
  ['player','progressRow','searchBtn'].forEach(id => $(id).classList.remove('hidden'));
  renderSheetSel(); updateProgress(); renderCard();
}

/* ---------- speech ---------- */
function chunk(line){
  const out = []; const MAX = 90;
  const sentences = line.match(/[^.!?。]+[.!?。]+(?=\s|$)|[^.!?。]+$|[.!?。]+/g) || [line];
  for (let s of sentences){
    s = s.trim(); if (!s) continue;
    while (s.length > MAX){
      let cut = Math.max(s.lastIndexOf(',', MAX), s.lastIndexOf('·', MAX), s.lastIndexOf(' ', MAX));
      if (cut < 30) cut = MAX;
      out.push(s.slice(0, cut + 1).trim()); s = s.slice(cut + 1).trim();
    }
    if (s) out.push(s);
  }
  return out;
}
function speakable(t){
  return t
    .replace(/^([\s　]*([-–•·▪◦○●■□※*]+|ㄴ+(?=\S)))+\s*/u, '')
    .replace(/<([^<>]{1,40})>/g, '$1.')
    .replace(/[\[\]【】「」『』]/g, ' ')
    .replace(/\s*(→|⇒|->|=>)\s*/g, ', ')
    .replace(/\s*(←|<-)\s*/g, ', ')
    .replace(/\s+\/\s+|\s*\/\s*(?=[가-힣])/g, ', ')
    .replace(/\bvs\.?\b/gi, ' 대 ')
    .replace(/[|]/g, ', ')
    .replace(/\s{2,}/g, ' ')
    .trim();
}
let voices = [];
function loadVoices(){
  voices = speechSynthesis.getVoices().filter(v => /^ko/i.test(v.lang));
  const sel = $('voiceSel');
  sel.innerHTML = voices.length ? voices.map(v => `<option value="${esc(v.voiceURI)}">${esc(v.name)}</option>`).join('') : '<option value="">기본 한국어 목소리</option>';
  if (S.settings.voice && voices.some(v => v.voiceURI === S.settings.voice)) sel.value = S.settings.voice;
}
function curVoice(){ return voices.find(v => v.voiceURI === S.settings.voice) || voices.find(v => /google/i.test(v.name)) || voices[0] || null; }

function speakFrom(i){
  const tok = ++S.token;
  if (i >= S.segs.length){ onCardEnd(tok); return; }
  S.seg = i; savePos(); highlight();
  const text = speakable(S.segs[i].text);
  if (!text){ speakFrom(i + 1); return; }
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'ko-KR'; const v = curVoice(); if (v) u.voice = v;
  u.rate = S.settings.rate;
  u.onend = () => { if (tok === S.token && S.playing) speakFrom(i + 1); };
  u.onerror = e => {
    if (tok !== S.token) return;
    if (e.error === 'interrupted' || e.error === 'canceled') return;
    console.warn('tts error', e.error); if (S.playing) speakFrom(i + 1);
  };
  speechSynthesis.speak(u);
}
function onCardEnd(tok){
  markRead(S.card);
  const n = sheet().cards.length;
  if (S.settings.auto && S.card < n - 1){
    setTimeout(() => { if (tok !== S.token || !S.playing) return; go(S.card + 1, 0); }, 500);
  } else { stop(); S.seg = 0; savePos(); highlight(); }
}
function play(fromSeg){
  if (!('speechSynthesis' in window)){ alert('이 브라우저는 음성 읽기를 지원하지 않아요. 크롬이나 사파리에서 열어 주세요.'); return; }
  S.playing = true; setPlayIcon(); wake(true);
  speechSynthesis.cancel();
  const start = fromSeg != null ? fromSeg : (S.seg >= S.segs.length ? 0 : S.seg);
  setTimeout(() => { if (S.playing) speakFrom(start); }, 60);
}
function stop(){ S.playing = false; S.token++; speechSynthesis.cancel(); setPlayIcon(); wake(false); }
function setPlayIcon(){ $('playBtn').textContent = S.playing ? '❚❚' : '▶'; }
function go(i, seg){
  const n = sheet().cards.length; if (i < 0 || i >= n) return;
  const was = S.playing; if (was){ S.token++; speechSynthesis.cancel(); }
  S.card = i; S.seg = seg || 0; renderCard(); savePos();
  window.scrollTo({ top: 0 });
  if (was) play(S.seg);
}
// keep the screen awake while reading (mobile browsers stop speech when the screen locks)
let lock = null;
async function wake(on){
  try{
    if (on && 'wakeLock' in navigator && !lock){ lock = await navigator.wakeLock.request('screen'); lock.addEventListener('release', () => { lock = null; }); }
    if (!on && lock){ await lock.release(); lock = null; }
  }catch(e){}
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && S.playing) wake(true); });

/* ---------- loading ---------- */
async function handleFile(file){
  if (!file) return;
  stop();
  $('empty').classList.remove('hidden'); $('view').classList.add('hidden');
  const msg = t => { $('loadMsg').textContent = t; };
  try{
    const { deck, images } = await parseWorkbook(file, msg);
    msg('저장 중…'); memImages = null;
    try{ await DB.replaceAll(deck, images); }catch(e){ console.warn(e); msg('기기 저장 공간이 부족해 이번 방문에만 사용돼요.'); memImages = images; }
    S.deck = deck;
    const p = LS.get(posKey(), null);
    const si = p ? deck.sheets.findIndex(s => s.name === p.sheet) : -1;
    S.sheetIdx = si >= 0 ? si : 0;
    const bp = p && p.bySheet[sheet().name];
    S.card = bp ? Math.min(bp.card, sheet().cards.length - 1) : 0; S.seg = bp ? bp.seg : 0;
    const imgs = deck.sheets.reduce((a, s) => a + s.cards.reduce((b, c) => b + c.img.length, 0), 0);
    msg(`카드 ${deck.sheets.reduce((a, s) => a + s.cards.length, 0)}장 · 그림 ${imgs}개`);
    showDeck();
    if (bp) showResume(p);
  }catch(e){ console.error(e); msg('읽지 못했어요: ' + (e.message || e)); }
}
let memImages = null;
const _dbGet = DB.get.bind(DB);
DB.get = async (store, key) => { if (store === 'images' && memImages) return memImages.get(key); return _dbGet(store, key); };

function showResume(p){
  const bp = p.bySheet[p.sheet]; const si = S.deck.sheets.findIndex(s => s.name === p.sheet);
  if (si < 0 || !bp) return;
  const c = S.deck.sheets[si].cards[bp.card]; if (!c) return;
  const tc = (S.settings.title[S.deck.key + '|' + p.sheet] ?? S.deck.sheets[si].titleCol);
  $('resumeTxt').textContent = `마지막 위치: ${S.deck.sheets.length > 1 ? p.sheet + ' · ' : ''}${bp.card + 1}번 ${(c.f[tc] || '').split('\n')[0]}`;
  $('resume').classList.remove('hidden');
}
async function boot(){
  if ('speechSynthesis' in window){ loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
  applySettingsUi();
  try{
    const deck = await DB.get('meta', 'deck');
    if (!deck) return;
    S.deck = deck;
    const p = LS.get(posKey(), null);
    const si = p ? deck.sheets.findIndex(s => s.name === p.sheet) : -1;
    S.sheetIdx = si >= 0 ? si : 0;
    const bp = p && p.bySheet[sheet().name];
    S.card = bp ? Math.min(bp.card, sheet().cards.length - 1) : 0; S.seg = bp ? bp.seg : 0;
    showDeck();
    if (bp && (bp.card > 0 || bp.seg > 0)) showResume(p);
  }catch(e){ console.warn('no saved deck', e); }
}

/* ---------- settings / search / jump ---------- */
function applySettingsUi(){
  const st = S.settings;
  $('rateBtn').textContent = st.rate.toFixed(1) + 'x';
  $('rateIn').value = st.rate; $('rateVal').textContent = st.rate.toFixed(1) + 'x';
  $('autoChk').checked = st.auto; $('sayHeadChk').checked = st.sayHead; $('themeSel').value = st.theme;
  if (st.theme) document.documentElement.dataset.theme = st.theme; else delete document.documentElement.dataset.theme;
}
function fillSheetSettings(){
  if (!S.deck){ $('titleSel').innerHTML = ''; $('fieldChecks').innerHTML = '<small>파일을 올리면 표시돼요.</small>'; return; }
  const cols = sheet().cols;
  $('titleSel').innerHTML = cols.map((c, i) => `<option value="${i}">${esc(c.name)}</option>`).join('');
  $('titleSel').value = titleCol();
  $('fieldChecks').innerHTML = cols.map((c, i) => i === titleCol() ? '' :
    `<label><input type="checkbox" data-i="${i}"${isOff(i) ? '' : ' checked'}> ${esc(c.name)}</label>`).join('');
}
$('settingsBtn').onclick = () => { fillSheetSettings(); $('settingsDlg').showModal(); };
$('closeSettings').onclick = () => $('settingsDlg').close();
$('settingsDlg').addEventListener('close', () => { if (S.deck){ const was = S.playing; if (was) stop(); renderCard(); if (S.seg >= S.segs.length) S.seg = 0; if (was) play(S.seg); } });
$('voiceSel').onchange = e => { S.settings.voice = e.target.value; saveSettings(); };
$('rateIn').oninput = e => { S.settings.rate = +e.target.value; saveSettings(); applySettingsUi(); };
$('sayHeadChk').onchange = e => { S.settings.sayHead = e.target.checked; saveSettings(); };
$('themeSel').onchange = e => { S.settings.theme = e.target.value; saveSettings(); applySettingsUi(); };
$('titleSel').onchange = e => { S.settings.title[offKey()] = +e.target.value; saveSettings(); fillSheetSettings(); };
$('fieldChecks').onchange = e => {
  const i = e.target.dataset.i; if (i == null) return;
  (S.settings.off[offKey()] = S.settings.off[offKey()] || {})[i] = !e.target.checked; saveSettings();
};
$('resetReadBtn').onclick = () => { if (S.deck && confirm(`'${sheet().name}' 시트의 읽음 기록을 지울까요?`)){ LS.set(readKey(), []); updateProgress(); } };
$('autoChk').onchange = e => { S.settings.auto = e.target.checked; saveSettings(); };
const RATES = [0.8, 0.9, 1, 1.1, 1.2, 1.3, 1.5, 1.7, 2];
$('rateBtn').onclick = () => {
  const i = RATES.findIndex(r => r > S.settings.rate + 0.001);
  S.settings.rate = i < 0 ? RATES[0] : RATES[i]; saveSettings(); applySettingsUi();
  if (S.playing) play(S.seg);
};

$('searchBtn').onclick = () => { $('searchDlg').showModal(); $('searchIn').select(); doSearch(); };
$('closeSearch').onclick = () => $('searchDlg').close();
$('searchIn').oninput = () => doSearch();
function doSearch(){
  const q = $('searchIn').value.trim().toLowerCase(); const out = [];
  const sh = sheet(), tc = titleCol();
  if (q){
    for (let i = 0; i < sh.cards.length && out.length < 60; i++) if ((sh.cards[i].f[tc] || '').toLowerCase().includes(q)) out.push(i);
    for (let i = 0; i < sh.cards.length && out.length < 60; i++) if (!out.includes(i) && sh.cards[i].f.join(' ').toLowerCase().includes(q)) out.push(i);
  }
  $('results').innerHTML = out.map(i => `<li><button data-i="${i}"><small>${i + 1}</small> ${esc((sh.cards[i].f[tc] || '(제목 없음)').split('\n')[0])}</button></li>`).join('')
    || (q ? '<li style="padding:8px;color:var(--muted)">찾는 토픽이 없어요</li>' : '');
}
$('results').onclick = e => { const b = e.target.closest('button[data-i]'); if (!b) return; $('searchDlg').close(); hideResume(); go(+b.dataset.i, 0); };

$('counter').onclick = () => { $('jumpIn').value = S.card + 1; $('jumpIn').max = sheet().cards.length; $('jumpDlg').showModal(); $('jumpIn').select(); };
$('closeJump').onclick = () => $('jumpDlg').close();
const doJump = () => { const n = parseInt($('jumpIn').value, 10); if (n >= 1){ $('jumpDlg').close(); hideResume(); go(Math.min(n, sheet().cards.length) - 1, 0); } };
$('doJump').onclick = doJump;
$('jumpIn').onkeydown = e => { if (e.key === 'Enter') doJump(); };

/* ---------- wiring ---------- */
$('fileBtn').onclick = $('pickBtn').onclick = () => $('fileIn').click();
$('fileIn').onchange = e => { handleFile(e.target.files[0]); e.target.value = ''; };
const drop = $('drop');
drop.ondragover = e => { e.preventDefault(); drop.classList.add('drag'); };
drop.ondragleave = () => drop.classList.remove('drag');
drop.ondrop = e => { e.preventDefault(); drop.classList.remove('drag'); handleFile(e.dataTransfer.files[0]); };

$('sheetSel').onchange = e => {
  stop(); hideResume();
  S.sheetIdx = +e.target.value;
  const p = LS.get(posKey(), { bySheet: {} }); const bp = p.bySheet[sheet().name];
  S.card = bp ? Math.min(bp.card, sheet().cards.length - 1) : 0; S.seg = bp ? bp.seg : 0;
  savePos(); updateProgress(); renderCard();
};
$('playBtn').onclick = () => { hideResume(); S.playing ? stop() : play(); };
$('prevBtn').onclick = () => { hideResume(); go(S.card - 1, 0); };
$('nextBtn').onclick = () => { hideResume(); go(S.card + 1, 0); };
function hideResume(){ $('resume').classList.add('hidden'); }
$('resumeX').onclick = hideResume;
$('resumeBtn').onclick = () => {
  hideResume();
  const p = LS.get(posKey(), null); if (!p) return;
  const si = S.deck.sheets.findIndex(s => s.name === p.sheet); const bp = p.bySheet[p.sheet];
  if (si >= 0 && si !== S.sheetIdx){ S.sheetIdx = si; renderSheetSel(); updateProgress(); }
  S.card = Math.min(bp.card, sheet().cards.length - 1); renderCard();
  play(Math.min(bp.seg, S.segs.length - 1));
};
$('card').onclick = e => {
  const t = e.target.closest('[data-seg]'); if (!t || e.target.tagName === 'IMG') return;
  if (window.getSelection && String(window.getSelection()).length) return;
  hideResume(); play(+t.dataset.seg);
};
$('lightbox').onclick = () => $('lightbox').classList.add('hidden');
document.addEventListener('keydown', e => {
  if (!S.deck || e.target.closest('input,select,textarea,dialog')) return;
  if (e.key === 'ArrowRight'){ hideResume(); go(S.card + 1, 0); }
  else if (e.key === 'ArrowLeft'){ hideResume(); go(S.card - 1, 0); }
  else if (e.key === ' '){ e.preventDefault(); $('playBtn').click(); }
  else if (e.key === 'Escape') $('lightbox').classList.add('hidden');
});
let tx = null, ty = 0;
$('view').addEventListener('touchstart', e => { if (e.touches.length === 1){ tx = e.touches[0].clientX; ty = e.touches[0].clientY; } }, { passive: true });
$('view').addEventListener('touchend', e => {
  if (tx == null) return;
  const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty; tx = null;
  if (Math.abs(dx) > 70 && Math.abs(dy) < 50){ hideResume(); go(S.card + (dx < 0 ? 1 : -1), 0); }
}, { passive: true });
window.addEventListener('pagehide', () => { if (S.deck) savePos(); });

boot();
</script>
</body>
